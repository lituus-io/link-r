[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "link-r"
version = "0.1.0"
description = "Tiny embeddable crawl-and-resolve link index: crawl a parent URL, build a hybrid index, resolve queries to ranked links."
# abi3-py312 is the floor the Rust side builds against; a lower declaration here
# would promise interpreters the wheel cannot actually load.
requires-python = ">=3.12"
readme = "README.md"
license = { text = "AGPL-3.0-or-later OR LicenseRef-Commercial" }
authors = [{ name = "lituus-io", email = "spicyzhug@gmail.com" }]
keywords = ["search", "index", "crawler", "embeddings", "bm25"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Text Processing :: Indexing",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
module-name = "link_r"
# Type stub shipped alongside the compiled module.
include = ["link_r.pyi"]
# The Rust side enables pyo3/abi3-py312, so maturin emits a single
# `cp312-abi3-<platform>` wheel that loads on 3.12 and every later version --
# one artifact per platform instead of one per interpreter.
#
# Production wheels add semantic embeddings:
#   maturin build --release --features onnx
