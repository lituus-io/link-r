[package]
name = "link-r-python"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "Python bindings for link-r (PyO3)."
publish = false

[lib]
name = "link_r"
crate-type = ["cdylib"]

[dependencies]
# abi3-py312 builds against the stable ABI, so one wheel per platform serves
# every Python from 3.12 up instead of one wheel per interpreter version. That
# keeps the release matrix small enough to stay legible.
#
# 0.29 rather than 0.22: the older release expands `create_exception!` to a
# `cfg(feature = "gil-refs")` check that current rustc reports as an unexpected
# cfg value, so the crate could not build under `-D warnings` at all.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"] }
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "net", "time"] }
# Aliased to `linkr` because this crate's own lib is named `link_r` (the Python
# module). The deterministic hash embedder is always compiled — it is the
# fallback the crate cannot work without — so it needs no feature here; the
# production wheel adds `onnx` (bge-small). rustls only — no openssl.
linkr = { path = "../..", package = "link-r", default-features = false, features = ["crawl", "fs"] }

[features]
# Build the wheel with semantic embeddings: `maturin build --features onnx`.
onnx = ["linkr/onnx"]

# Detach from the parent crate's build so the main `cargo test` never needs Python.
[workspace]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
