[package]
name = "uu-link-r"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
description = "Tiny embeddable crawl-and-resolve link index: crawl a parent URL, distill keywords, build a zero-copy hybrid index, resolve queries to ranked links."
repository = "https://github.com/lituus-io/link-r"
authors = ["lituus-io <support@lituus.io>"]
homepage = "https://github.com/lituus-io/link-r"
documentation = "https://docs.rs/uu-link-r"
readme = "README.md"
exclude = ["/.github", "/scripts", "/bindings", "/fuzz"]
keywords = ["search", "index", "crawler", "embeddings", "bm25"]
categories = ["text-processing", "web-programming", "caching"]

[features]
# The default stack: crawl an HTTPS parent, extract HTML/Markdown, embed with the
# deterministic hash embedder, persist a zero-copy mmap index. Hermetic & offline.
default = ["hash", "markdown", "html", "crawl", "fs"]

# --- embedders ---
hash = []                                          # deterministic, zero-dep (always recommended as fallback)
onnx = ["dep:fastembed"]                            # production: bge-small-en-v1.5

# --- extractors ---
markdown = []                                       # Markdown + code, zero-dep
html = ["dep:scraper", "dep:memchr"]                # HTML content + fast <a href> link scanner

# --- sources / fetch ---
http = ["dep:reqwest"]                              # HttpFetcher (rustls)
crawl = ["http", "html", "dep:async-stream", "dep:futures-timer"]  # recursive depth crawler
fs = ["dep:walkdir"]                                # local filesystem source
# GitHub tree-API source: one API call lists every blob with its SHA, so an
# unchanged repo revalidates with a single request and zero content fetches.
github = ["http", "dep:async-stream", "dep:serde", "dep:serde_json"]

# --- auth ---
oauth = ["http", "dep:arc-swap"]                    # expiring-token refresh provider
robots = ["crawl", "dep:texting_robots"]            # honor robots.txt (off by default)

# --- performance / scale ---
quant = []                                          # int8 + binary quantization, two-tier rerank
parallel = ["dep:rayon"]                            # rayon-parallel build

# --- composition with graph-r and object storage ---
# Publish and load indexes on an object store: fenced HEAD, create-only
# generations, in-place replica refresh (`remote` module).
remote = []
# Cloud Storage for `remote` and `kb`.
gcs = ["objstore-r/gcs"]
# The graph-r bridge: absorb a crawl into a graph-r store and drive refresh
# from its due-lists (`bridge` module).
graph = ["graph-r/store", "crawl", "fs", "github"]
# One knowledge base: graph-r + link-r on an object store, fenced publish,
# zero-copy hydration, fused lookups (`kb` module).
kb = ["graph", "remote", "objstore-r/mirror", "dep:futures-util"]

full = ["hash", "onnx", "markdown", "html", "http", "crawl", "fs",
        "github", "oauth", "robots", "quant", "parallel"]

[lib]
name = "link_r"

[package.metadata.docs.rs]
# Every feature but `onnx`, whose build downloads a runtime.
features = ["hash", "markdown", "html", "http", "crawl", "fs", "github", "oauth", "robots", "quant", "parallel", "remote", "gcs", "graph", "kb"]

[dependencies]
# --- always-on core (tiny, offline) ---
bytes = "1.7"
smallvec = { version = "1.13", features = ["union", "const_generics"] }
compact_str = "0.8"
thiserror = "1.0"
futures = "0.3"
url = "2.5"
zstd = "0.13"
secrecy = "0.10"
roaring = "0.10"
# The shared core: xxh3, byte codecs, the sectioned container, mmap, atomic
# files and the text rules (one implementation with graph-r's lexicon).
graph-r = { package = "uu-graph-r", path = "../graph-r", version = "0.4.0", default-features = false, features = ["mmap"] }
# Retry, backoff and Retry-After policy shared with every HTTP client.
objstore-r = { package = "uu-objstore-r", path = "../objstore-r", version = "0.2.0" }
# try_join: the knowledge base hydrates both halves concurrently (feature kb).
futures-util = { version = "0.3", optional = true, default-features = false, features = ["alloc"] }

# --- feature-gated ---
reqwest = { version = "0.12", default-features = false, features = ["stream", "http2", "rustls-tls", "gzip"], optional = true }
async-stream = { version = "0.3", optional = true }
futures-timer = { version = "3", optional = true }
scraper = { version = "0.20", optional = true }
memchr = { version = "2.7", optional = true }
walkdir = { version = "2.5", optional = true }
# rustls (not native-tls/openssl) to match the house TLS policy.
fastembed = { version = "4", optional = true, default-features = false, features = ["ort-download-binaries", "hf-hub-rustls-tls"] }
arc-swap = { version = "1.7", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
rayon = { version = "1.10", optional = true }
texting_robots = { version = "0.2", optional = true }

[dev-dependencies]
objstore-r = { package = "uu-objstore-r", path = "../objstore-r", version = "0.2.0", features = ["testing", "gcs", "mirror"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "test-util", "net", "io-util", "time"] }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
proptest = "1.5"
tempfile = "3.12"

[[bench]]
name = "index_bench"
harness = false

# The crawl bench and the GitHub example both reach for CrawlSource/LinkIndex
# and the HTML link scanner, which only exist under `crawl`. Without
# `required-features` they are compiled for every feature set, so
# `cargo check --no-default-features --all-targets` fails on the *targets*
# even though the library itself builds cleanly for every combination.
[[bench]]
name = "crawl_bench"
harness = false
required-features = ["crawl"]

[[example]]
name = "crawl_github_docs"
required-features = ["crawl"]

[workspace]
# `bindings/python` (PyO3 cdylib) joins as a member in Phase 6.
members = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = true

[[test]]
name = "remote"
required-features = ["remote"]

[[test]]
name = "bridge_e2e"
required-features = ["graph"]

[[test]]
name = "kb"
required-features = ["kb"]

[[test]]
name = "kb_gcs"
required-features = ["kb", "gcs"]

[[test]]
name = "proptest_kb"
required-features = ["kb"]

[[bench]]
name = "kb_bench"
harness = false
required-features = ["kb"]

