name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always
  # Every feature except `onnx`. `onnx` pulls fastembed, which downloads a model
  # at build time -- that would make CI network-dependent, slow, and able to fail
  # for reasons that have nothing to do with this crate. It stays an opt-in
  # release-wheel feature, exercised when a wheel is built, not on every push.
  CI_FEATURES: "hash,markdown,html,http,crawl,fs,github,oauth,robots,quant,parallel"

# The toolchain is NOT selected by dtolnay/rust-toolchain: that action exports
# RUSTUP_TOOLCHAIN, which overrides rust-toolchain.toml, so CI would silently
# test a different compiler than developers run -- the exact failure the dated
# pin exists to prevent. `rustup show` installs the toolchain the file names.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --features "$CI_FEATURES" --all-targets

  test:
    name: Test (${{ matrix.name }})
    needs: fmt
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
          - { name: macos-arm64, runner: macos-15 }
          - { name: windows-x86_64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      # The security suite binds a loopback TCP listener to prove that a
      # cross-host redirect drops the Authorization header, so it needs a
      # shell that treats $CI_FEATURES the same on every runner.
      - name: Test
        shell: bash
        run: cargo test --features "$CI_FEATURES"

  features:
    name: Feature matrix
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # "Installable by requirement" is only true for the combinations someone
      # actually tried, so every feature is checked standing alone. The bench and
      # example targets declare required-features, which is why --all-targets can
      # be used here at all.
      - name: Each feature alone
        run: |
          set -euo pipefail
          cargo check --no-default-features --all-targets
          for f in hash markdown html http crawl fs github oauth robots quant parallel; do
            echo "::group::$f"
            cargo check --no-default-features --features "$f" --all-targets
            echo "::endgroup::"
          done

  docs:
    name: Docs
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --features "$CI_FEATURES" --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  python:
    name: Python bindings (${{ matrix.os }})
    needs: fmt
    # The persisted store must be readable AND writable on every OS a user
    # runs, so the binding suite runs on all three per push — not only at
    # release time.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
          key: pyo3-${{ matrix.os }}
      - uses: actions/setup-python@v5
        with:
          # 3.12 is the abi3 floor the binding builds against; the resulting
          # wheel loads on every later version from the same artifact.
          python-version: "3.12"
      - name: Fmt and clippy the binding
        working-directory: bindings/python
        run: |
          cargo fmt --check
          cargo clippy --all-targets
      - name: Build and test the wheel in place
        working-directory: bindings/python
        shell: bash
        run: |
          python -m venv .venv
          . .venv/bin/activate 2>/dev/null || . .venv/Scripts/activate
          pip install maturin pytest
          maturin develop --release
          pytest tests/ -v

  coverage:
    name: Coverage
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      # Reported, not gated: publish the number first so the floor that follows
      # is a measurement rather than a guess.
      - name: Measure
        run: |
          cargo llvm-cov --features "$CI_FEATURES" --summary-only | tee coverage.txt
          {
            echo "### Coverage"
            echo ""
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  objstore:
    name: Object storage (link-r-objstore)
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the objstore-r sibling
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.SIBLING_REPO_TOKEN || github.token }}@github.com/lituus-io/objstore-r.git" \
            "$GITHUB_WORKSPACE/../objstore-r"
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: objstore
          key: objstore
      - name: Start fake-gcs-server
        run: |
          docker run -d --name fakegcs -p 4443:4443 fsouza/fake-gcs-server \
            -scheme http -port 4443 -public-host 127.0.0.1:4443 -external-url http://127.0.0.1:4443
          for i in $(seq 1 30); do curl -sf "http://127.0.0.1:4443/storage/v1/b?project=test" && break; sleep 1; done
      - name: Fmt, clippy, test (memory, local directory, GCS emulator)
        working-directory: objstore
        env:
          OBJSTORE_FAKE_GCS: http://127.0.0.1:4443
        run: |
          cargo fmt --check
          cargo clippy --all-features --all-targets
          cargo test --all-features

  semver:
    name: Semver (additive only)
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: semver
      - name: API compatibility against the previous release tag
        run: |
          cur="v$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["packages"][0]["version"])')"
          prev=$(git tag --sort=-v:refname --merged HEAD | grep -v "^$cur$" | head -1)
          echo "baseline: $prev"
          git worktree add "$GITHUB_WORKSPACE/../link-r-baseline" "$prev"
          RUSTUP_TOOLCHAIN=stable cargo install cargo-semver-checks --locked
          cargo semver-checks --baseline-root "$GITHUB_WORKSPACE/../link-r-baseline" --release-type minor
          cargo semver-checks --baseline-root "$GITHUB_WORKSPACE/../link-r-baseline" --all-features --release-type minor
